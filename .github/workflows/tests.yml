name: tests

# The suite is the project's evidence that its claims hold, so it runs on every
# push rather than on a schedule. Tests that need the ~650MB IEEE-CIS dataset
# skip themselves when data/raw is absent, which is the case on a clean
# checkout — so this passes here without the dataset while still exercising the
# leakage, causality, concurrency, security, serving and UI suites.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        run: pytest -q

      - name: Report which tests skipped, and why
        if: always()
        run: pytest -q -rs || true
