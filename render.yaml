# Render blueprint for the review-queue dashboard demo instance.
#
# This deploys the DASHBOARD ONLY. Training and run_pipeline.py are not part of
# the web service: they need the ~650MB IEEE-CIS dataset and the trained model
# artifacts, neither of which belongs on a free web tier. The dashboard instead
# serves data/demo_review_queue.db, a committed snapshot of real briefs (see
# scripts/seed_demo_db.py and results/demo_seed_provenance.json).
#
# Free-tier notes:
#   - The filesystem is ephemeral. Resolutions made during a demo are real
#     writes to a real SQLite file, but they reset to the committed snapshot on
#     every redeploy. That is intentional for a demo instance.
#   - Instances sleep when idle; the first request after a sleep takes ~30-50s.
#     Point an external uptime monitor at /health every 5 minutes to keep the
#     instance warm — that is the real fix, and /health is public and cheap
#     precisely so it can be pinged. The client also shows a labelled "waking
#     up" state rather than spinning silently, but nothing in the page can help
#     until the container serves its first byte.
#   - One worker, not two: the free instance has 512MB and 0.1 CPU, and this
#     app is I/O-bound on SQLite. Threads give the concurrency; a second worker
#     process would just duplicate the interpreter for no throughput gain.
services:
  - type: web
    name: fraud-spike-review-queue
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEMO_MODE
        value: "1"
      # Basic-auth credentials, applied to STATE-CHANGING requests only. Every
      # page and every read API is public: a reviewer opening the link must see
      # the product, not a password box. sync:false means Render prompts for the
      # value in its dashboard rather than reading it from this committed file —
      # never put the actual credentials here.
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Razorpay TEST-MODE credentials for /live. The key id must carry the
      # rzp_test_ prefix; anything else is refused before a network call is
      # made, so this service cannot reach a live payment environment. Set all
      # three in the Render dashboard, and register the webhook in the Razorpay
      # dashboard against https://<your-service>/api/webhook/razorpay.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
